                - generic [ref=e485]:
                  - text: Expected actions
                  - textbox "Expected actions" [ref=e486]: "Declare respiratory failure and proceed to controlled RSI with team time-out Optimize pre-oxygenation; consider gentle BVM if needed while avoiding aggressive ventilation (Capability: Bag-mask ventilation) Prepare difficult airway backup and assign roles; have suction ready (Capability: Suctioning) Select RSI meds appropriate for severe asthma and hypotension risk; plan for post-intubation sedation/analgesia Plan ventilator strategy for asthma (low rate, long expiratory time, permissive hypercapnia) and discuss risk of breath stacking"
                - generic [ref=e487]:
                  - text: Remarks
                  - textbox "Remarks" [ref=e488]: "Key teaching point: decreasing wheeze with worsening distress suggests minimal airflow, not improvement. If learners attempt to delay intubation despite worsening hypercapnia and mental status, patient will become obtunded and peri-arrest."
                - generic [ref=e489]:
                  - text: Instructor control
                  - textbox "Instructor control" [ref=e490]: If team performs checklist/time-out and prepares equipment, allow stable window for RSI If learners provide overly aggressive bagging, worsen dynamic hyperinflation (SpO2 may drop and BP may fall in next state) If asked, no evidence of pneumothorax on prior CXR; trachea midline
