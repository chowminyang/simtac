                  - text: Physical exam
                  - textbox "Physical exam" [ref=e222]: "Appearance: anxious, tripod position, speaking in short phrases, diaphoresis Work of breathing: severe accessory muscle use; Capability: Spontaneous breathing; Capability: Bilateral chest rise and fall Auscultation: diffuse tight wheeze, prolonged expiratory phase (Lung Sound: Wheezes) Perfusion: warm, pulses rapid; Capability: Palpation of pulses"
                - generic [ref=e223]:
                  - text: Investigations
                  - textbox "Investigations" [ref=e224]: "Place patient on monitor; obtain 12-lead ECG if concerned (expect sinus tachycardia) Point-of-care glucose (normal) Venous blood gas (optional in this state): pH 7.33, pCO2 48 (early hypercapnia possible)"
                - generic [ref=e225]:
                  - text: Expected actions
                  - textbox "Expected actions" [ref=e226]: Assign roles and establish team leader; use closed-loop communication Immediate oxygen (target SpO2 94-98%) Start continuous/nebulized bronchodilators (albuterol + ipratropium) Administer systemic corticosteroids (e.g., IV methylprednisolone or PO prednisone if able) Establish IV access; prepare magnesium sulfate as next step Reassess frequently; call RT early; prepare for potential deterioration
                - generic [ref=e227]:
                  - text: Remarks
                  - textbox "Remarks" [ref=e228]: "If asked, patient reports: 'My inhaler isn't working anymore.' No fever. No chest pain. No known anaphylaxis exposure. Instructor may prompt for structured communication (SBAR, role assignment, read-backs)."
                - generic [ref=e229]:
                  - text: Instructor control
                  - textbox "Instructor control" [ref=e230]: Ensure monitor shows tachycardia and hypoxemia; patient anxious voice and tachypnea If oxygen and nebulizers started promptly, SpO2 improves to 94% but work of breathing remains high Do not improve wheeze significantly yet; keep severe obstruction
                - generic [ref=e231]:
                  - text: Transition rule
                  - combobox "Transition rule" [ref=e232]:
