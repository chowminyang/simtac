                - generic [ref=e448]:
                  - text: Investigations
                  - textbox "Investigations" [ref=e449]: "CXR (portable): hyperinflation; no infiltrate; no pneumothorax VBG/ABG if obtained now: pH 7.29, pCO2 58, HCO3 26, lactate 2.0 Peak flow (if attempted) very low/unobtainable due to distress"
                - generic [ref=e450]:
                  - text: Expected actions
                  - textbox "Expected actions" [ref=e451]: "Continue continuous bronchodilator therapy; confirm correct delivery and dosing Administer magnesium sulfate IV (e.g., 2 g over 20 minutes) if not already given Consider IM/IV epinephrine if unable to move air or concern for impending arrest (contextualized to local practice) Explicitly discuss and prepare for airway: call for airway cart, assign airway/medication roles, prepare RSI checklist, prepare BVM with PEEP valve (low PEEP), suction ready (Capability: Suctioning; Capability: Bag-mask ventilation) Reassess mental status and ventilation; anticipate need for intubation"
                - generic [ref=e452]:
                  - text: Remarks
                  - textbox "Remarks" [ref=e453]: "Patient increasingly tired: 'I'm... so... tired.' If learners ask about prior intubation: none, but ICU admission last year. If learners communicate and plan early, set them up for controlled RSI."
                - generic [ref=e454]:
                  - text: Instructor control
                  - textbox "Instructor control" [ref=e455]: "If magnesium given and continuous nebs maintained, only minimal improvement in RR; CO2 continues to rise If learners fail to reassess ventilation or ignore rising CO2, progress to fatigue more rapidly Cue RT confederate to ask: 'Do you want me to set up for BiPAP or prepare for intubation?'"
