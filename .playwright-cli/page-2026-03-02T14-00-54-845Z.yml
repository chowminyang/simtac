                - generic [ref=e555]:
                  - text: Expected actions
                  - textbox "Expected actions" [ref=e556]: "Reassess ventilation strategy: ensure long expiratory time, avoid breath stacking; accept permissive hypercapnia if hemodynamically stable Continue bronchodilator therapy via inline nebulization as available; continue steroids Ensure adequate sedation/analgesia; consider paralysis only if severe ventilator dyssynchrony despite sedation (per local practice) Communicate disposition: ICU admission; structured handover with key events, meds given, ventilator strategy, and pending issues Team debrief-in-action: summarize what went well and what to monitor next (auto-PEEP, hypotension, pneumothorax)"
