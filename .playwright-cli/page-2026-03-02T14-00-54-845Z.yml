                  - textbox "Investigations" [ref=e519]: Confirm tube placement clinically and with CO2; bilateral chest rise; auscultation Post-intubation vitals trending; consider repeat ABG after stabilization
                - generic [ref=e520]:
                  - text: Expected actions
                  - textbox "Expected actions" [ref=e521]: "Perform RSI with clear role assignment and closed-loop medication delivery Limit apnea time; optimize first-pass success (positioning, pre-oxygenation, apneic oxygenation if available) Confirm ETT placement; secure tube; start continuous sedation/analgesia Initiate ventilator settings appropriate for severe asthma: low RR, low tidal volume/moderate, high inspiratory flow, long expiratory time; monitor for auto-PEEP and hypotension If hypotension occurs, treat with fluids/vasopressors as appropriate and reduce minute ventilation to mitigate breath stacking"
                - generic [ref=e522]:
                  - text: Remarks
                  - textbox "Remarks" [ref=e523]: "If learners struggle with ventilation after intubation, prompt consideration of breath stacking and the need to disconnect circuit briefly to allow full exhalation (instructor cue). If learners request alternative airway: allow LMA as rescue if intubation fails (Capability: Laryngeal mask airway insertion)."
                - generic [ref=e524]:
                  - text: Instructor control
                  - textbox "Instructor control" [ref=e525]: If intubation is performed effectively, SpO2 improves to 95% within 60-90 seconds after ventilation begins If learners hyperventilate (high RR), then BP drops to 86/50 with rising peak pressures (simulate dynamic hyperinflation); improve when they decrease RR and allow expiratory time If prolonged attempt without oxygenation, desaturate to low 80s; allow recovery with BVM and reattempt
                - generic [ref=e526]:
                  - text: Transition rule
                  - combobox "Transition rule" [ref=e527]:
