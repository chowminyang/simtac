                    - text: Physical exam
                    - textbox "Physical exam" [ref=e487]: "Mental status: more lethargic; intermittently disoriented (GCS 13). Breathing: increased work of breathing but speaking in short sentences. Circulation: delayed capillary refill; pulses present. Capability: Palpation of pulses. GU: oliguria reported by nurse; bladder scan low volume (if requested)."
                  - generic [ref=e488]:
                    - text: Investigations
                    - textbox "Investigations" [ref=e489]: "Repeat lactate (if ordered): 4.6. Bedside ultrasound (if requested): moderate right hydronephrosis. CT A/P non-contrast (if requested): 7 mm obstructing right proximal ureteral stone with hydronephrosis; perinephric stranding consistent with pyelonephritis."
                  - generic [ref=e490]:
                    - text: Expected actions
                    - textbox "Expected actions" [ref=e491]: "Recognize septic shock (hypotension with elevated lactate) and escalate resuscitation. Continue fluids with reassessment; consider early vasopressor initiation for persistent hypotension (e.g., norepinephrine via peripheral IV while preparing central access per local policy). Insert Foley catheter for urine output monitoring; strict I&Os. Reassess for other shock etiologies; ensure antibiotics given/infusing; consider adding coverage if indicated by local antibiogram. Consult urology urgently for source control (ureteral stent vs nephrostomy) and consult ICU for shock. Communication checkpoint: Call urology using SBAR including CT/US findings, current BP/pressors, lactate trend, and urgency for decompression."
                  - generic [ref=e492]:
                    - text: Remarks
                    - textbox "Remarks" [ref=e493]: "If learners do not start vasopressors: nurse prompts, 'BP is still low despite fluids—do you want a pressor?' Safety-net alternative: If they hesitate due to lack of central line, allow peripheral norepinephrine per policy; instructor can cue 'You may start peripheral pressors while arranging definitive access.' If learners omit Foley: prompt with 'No urine output since arrival—do you want a catheter for monitoring?'"
                  - generic [ref=e494]:
                    - text: Instructor control
                    - textbox "Instructor control" [ref=e495]: "If norepinephrine started and titrated appropriately, BP improves to ~100/60 within 3–5 minutes; if not, BP continues to fall in next state. If learners request ICU: consultant agrees and asks for current pressor dose and response to fluids. Transition trigger (to State 3): If norepinephrine not initiated within ~5 minutes of persistent hypotension OR mental status worsens/SpO2 trends down with fatigue."
                  - generic [ref=e496]:
                    - text: Transition rule
                    - combobox "Transition rule" [ref=e497]:
                      - option "next" [selected]
                      - option "auto"
                      - option "handler"
