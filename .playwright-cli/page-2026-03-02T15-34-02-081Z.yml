                    - textbox "Investigations" [ref=e559]: "Repeat lactate (if ordered): 3.8 trending down (not yet normalized). Cultures remain pending. Imaging confirmed obstruction; urology/IR plan documented (ureteral stent or nephrostomy within hours)."
                  - generic [ref=e560]:
                    - text: Expected actions
                    - textbox "Expected actions" [ref=e561]: "Maintain MAP goal with vasopressor titration; continue reassessment and document response (BP, mentation, lactate trend, urine output). Confirm antibiotics administered; plan redosing if prolonged course/transfer delay. Prepare for transfer to ICU and for source control procedure; ensure lines, infusion pumps, and monitoring in place. Perform structured handoff (SBAR) to ICU/transport team including diagnosis, interventions (fluids volume, antibiotics, pressor dose), lactate trend, imaging findings, and pending source control. Communication checkpoint: Update family/partner on severity (septic shock), current stabilization, and next steps (ICU + urgent decompression)."
