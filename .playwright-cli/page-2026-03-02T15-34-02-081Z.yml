                  - generic [ref=e521]:
                    - text: Physical exam
                    - textbox "Physical exam" [ref=e522]: "Mental status: markedly confused, minimally cooperative; GCS 11–12; responds to voice/pain. Breathing: tachypnea with fatigue; shallow respirations. Capability: Difficulty breathing. Circulation: cool extremities; weak peripheral pulses. Capability: Palpation of pulses. Skin: mottling begins at knees (verbalized)."
                  - generic [ref=e523]:
                    - text: Investigations
                    - textbox "Investigations" [ref=e524]: "ABG/VBG (if ordered): metabolic acidosis (pH 7.28), low bicarbonate; CO2 low from hyperventilation. Repeat glucose (if ordered): 13 mmol/L (234 mg/dL). Creatinine and potassium remain elevated; consider acute kidney injury."
                  - generic [ref=e525]:
                    - text: Expected actions
                    - textbox "Expected actions" [ref=e526]: "Escalate vasopressors promptly (titrate norepinephrine; add additional access as needed). Ensure ongoing antibiotic therapy; consider second-line/add-on per policy if severe shock or concern for resistant organism. Airway/ventilation planning: apply high-flow oxygen support as available; prepare for assisted ventilation if mental status/respiratory fatigue worsens. Capability: Bag-mask ventilation (if they choose to support ventilation). Frequent reassessment (BP q2–3 min, mental status, urine output). Finalize urgent source control plan with urology/IR; prepare for transfer to OR/IR/ICU once stabilized enough. Communication checkpoint: Team leader performs a 30-second huddle—shares priorities (pressors, oxygen/airway readiness, antibiotics complete, decompression plan) and assigns tasks with closed-loop confirmation."
                  - generic [ref=e527]:
                    - text: Remarks
                    - textbox "Remarks" [ref=e528]: "Safety-net alternative: If learners focus only on airway and ignore shock, instructor should allow brief BVM support but continue hypotension until pressors/fluids addressed. If learners do not call urology/IR: consultant confederate calls back asking, 'Is this obstructed infected system? She needs decompression—what’s your plan and timing?' If learners request sedation/intubation without hemodynamic prep: remind via nurse prompt, 'Her pressure is very low—should we optimize before induction?' (focus on resuscitation-first principle)."
                  - generic [ref=e529]:
                    - text: Instructor control
                    - textbox "Instructor control" [ref=e530]: "If norepinephrine is initiated/titrated and additional fluid bolus given, improve BP to ~96/58 and SpO2 to 94% with decreased RR. If no pressors by end of state: BP may drop to 60 systolic and patient becomes increasingly obtunded (do not progress to arrest unless learners persistently ignore shock). Transition trigger (to State 4): After effective pressor titration + antibiotics running + definitive source control arranged (urology/IR acceptance) OR after instructor time limit (~5 minutes in this state)."
                  - generic [ref=e531]:
                    - text: Transition rule
                    - combobox "Transition rule" [ref=e532]:
