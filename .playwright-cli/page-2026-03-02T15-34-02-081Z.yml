                  - generic [ref=e251]:
                    - text: Physical exam
                    - textbox "Physical exam" [ref=e252]: "General: ill-appearing, febrile, anxious; answers slowly but follows commands (GCS 14). Airway: patent. Capability: Spontaneous breathing. Breathing: tachypneic; equal air entry; no focal findings. Circulation: warm extremities, bounding pulses. Capability: Palpation of pulses. Abdomen/GU: right costovertebral angle tenderness; suprapubic discomfort; no peritonitis. Skin: warm, diaphoretic. Capability: Sweat."
                  - generic [ref=e253]:
                    - text: Investigations
                    - textbox "Investigations" [ref=e254]: "Point-of-care glucose: 14 mmol/L (252 mg/dL). ECG: sinus tachycardia. Labs available if ordered: WBC 18.5, Cr 2.1 (baseline unknown), lactate 3.2, Na 130, K 4.6, HCO3 18. Urinalysis (if obtained): leukocyte esterase positive, nitrite positive, WBC >50/hpf, bacteria present. Blood cultures x2 and urine culture: pending (must be obtained before antibiotics if feasible)."
                  - generic [ref=e255]:
                    - text: Expected actions
                    - textbox "Expected actions" [ref=e256]: "Assign roles; initiate sepsis protocol; continuous monitoring and frequent BP cycling. Establish IV access (2 large-bore IVs). Capability: IV Access (Right Arm Only). Send blood cultures x2, CBC/CMP, venous/arterial lactate, UA/urine culture; check glucose. Start isotonic fluids (e.g., 1 L bolus; target ~30 mL/kg as tolerated) and reassess after each bolus. Administer broad-spectrum IV antibiotics appropriate for obstructive pyelonephritis after cultures (e.g., piperacillin-tazobactam or cefepime +/- vancomycin per local policy). Communication checkpoint: Provide a structured update to the bedside nurse and partner (working diagnosis = sepsis likely urinary source; immediate plan = fluids, cultures, antibiotics, imaging/consult)."
                  - generic [ref=e257]:
                    - text: Remarks
                    - textbox "Remarks" [ref=e258]: "If learners delay cultures/antibiotics: nurse confederate prompts, 'Do you want cultures before antibiotics? Which antibiotic now?' Safety-net alternative: If learners do not recognize sepsis, family confederate states, 'She is much more confused than usual,' prompting reassessment and sepsis screening. Instructor note: If fluids started promptly and antibiotics ordered early, you may slightly improve mental status but maintain risk of hypotension due to obstruction."
                  - generic [ref=e259]:
                    - text: Instructor control
                    - textbox "Instructor control" [ref=e260]: "Provide temperature verbally if asked: 39.2°C. If learners request imaging: respond that CT abdomen/pelvis is available; bedside ultrasound can be performed. Transition trigger (to State 2): After 10–15 minutes OR after 1–2 L fluids given, BP trends down with rising lactate/ongoing tachycardia despite initial measures."
                  - generic [ref=e261]:
                    - text: Transition rule
                    - combobox "Transition rule" [ref=e262]:
                      - option "next" [selected]
                      - option "auto"
                      - option "handler"
