              - generic [ref=e904]:
                - generic [ref=e905]:
                  - text: Physical exam
                  - textbox "Physical exam" [ref=e906]: "General: obtunded; minimal response to voice; GCS 10 Breathing: marked fatigue; shallow respirations; Capability: Difficulty breathing Lung Sound: Crackles and Lung Sound: Pneumonia Circulation: cool, mottled knees; very delayed cap refill (>5 sec); weak pulses; Capability: Palpation of pulses Skin: clammy; Capability: Sweat"
                - generic [ref=e907]:
                  - text: Investigations
                  - textbox "Investigations" [ref=e908]: "Lactate: 5.2 mmol/L Renal function worsening: creatinine 2.4 mg/dL ABG/VBG (if repeated): worsening metabolic acidosis; oxygenation marginal on NRB"
                - generic [ref=e909]:
                  - text: Expected actions
                  - textbox "Expected actions" [ref=e910]: "Declare septic shock and initiate vasopressor (e.g., norepinephrine per local practice) after adequate fluid resuscitation; target MAP ≥ 65 mmHg. Escalate airway/oxygen strategy due to fatigue and declining mentation: consider assisted ventilation with bag-mask and prepare for intubation if within scope. Capability: Bag-mask ventilation; Capability: Intubation (if performed). Ensure ongoing source management: confirm pneumonia treatment, consider sputum culture if feasible, reassess for alternative sources if unclear. Reassess perfusion: mental status, cap refill, pulse quality, urine output; plan repeat lactate. Perform closed-loop communication and maintain SBAR updates to ICU during escalation and prior to transfer."
                - generic [ref=e911]:
                  - text: Remarks
                  - textbox "Remarks" [ref=e912]: "If vasopressor is started appropriately, BP should improve; if delayed, patient approaches peri-arrest (do not progress to cardiac arrest unless instructor chooses extension). If learners attempt additional large fluid boluses without vasopressor despite hypotension, minimal BP response and worsening respiratory fatigue. If learners choose to intubate, treat as high-risk: hypotension may worsen briefly unless vasopressor/fluids optimized."
                - generic [ref=e913]:
                  - text: Instructor control
                  - textbox "Instructor control" [ref=e914]: When vasopressor initiated, increase BP over 1–2 minutes to ~98/56 and HR to ~122. If bag-mask ventilation used effectively, increase SpO2 to 95%. If intubation attempted without hemodynamic preparation, transient BP drop to ~65/35 for 60–90 seconds; then allow recovery if vasopressor/fluids applied.
                - generic [ref=e915]:
                  - text: Transition rule
                  - combobox "Transition rule" [ref=e916]:
                    - option "next" [selected]
                    - option "auto"
                    - option "handler"
