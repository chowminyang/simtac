                - generic [ref=e870]:
                  - text: Physical exam
                  - textbox "Physical exam" [ref=e871]: "Circulation: cooler extremities, delayed cap refill (4 sec); weak peripheral pulses; Capability: Palpation of pulses Neuro: drowsy, responds to voice; GCS 12 Breathing: still tachypneic, tiring; Lung Sound: Crackles Heart Sound: Gallop (optional cue if learners auscultate; consistent with stress/volume status)"
                - generic [ref=e872]:
                  - text: Investigations
                  - textbox "Investigations" [ref=e873]: "Lactate now 4.5 mmol/L (if drawn after deterioration) Point-of-care ultrasound (if requested): IVC suggestive of low intravascular volume (verbal cue only) CXR: persistent RLL infiltrate (no pneumothorax)"
                - generic [ref=e874]:
                  - text: Expected actions
                  - textbox "Expected actions" [ref=e875]: "Recognize hypotension and concern for progression to septic shock; initiate 30 mL/kg crystalloid strategy as appropriate with frequent reassessment. Reassess airway/ventilation; prepare for assisted ventilation if mental status declines. Capability: Bag-mask ventilation (if used). Confirm antibiotics administered; consider second agent per local severe CAP/sepsis guideline if indicated. Initiate early vasopressor planning if hypotension persists after adequate fluids; identify need for infusion pump and close BP monitoring. Communicate deterioration using SBAR to ICU/consultant (Situation: septic pneumonia; Background: elderly diabetic/CKD; Assessment: worsening hypotension, lactate rising; Recommendation: ICU admission, vasopressors, possible intubation)."
                - generic [ref=e876]:
                  - text: Remarks
                  - textbox "Remarks" [ref=e877]: "If learners give additional 1–2 L promptly with reassessment, transient BP improvement may occur but will not fully resolve shock trajectory. If no fluid escalation occurs, patient deteriorates faster to profound hypotension. If learners do not call ICU, confederate nurse prompts: 'Do you want me to update ICU/charge nurse?'"
                - generic [ref=e878]:
                  - text: Instructor control
                  - textbox "Instructor control" [ref=e879]: If total fluids reach ~2–2.5 L, allow BP to rise briefly to ~100/60 then drift back down within 2–3 minutes. If learners initiate bag-mask ventilation due to fatigue, increase SpO2 to 95% while RR may drop to 24 assisted. Maintain rhythm as sinus tachycardia unless learners introduce another complication (do not add arrhythmia).
                - generic [ref=e880]:
                  - text: Transition rule
                  - combobox "Transition rule" [ref=e881]:
                    - option "next" [selected]
                    - option "auto"
                    - option "handler"
