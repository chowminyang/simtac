                  - textbox "Physical exam" [ref=e941]: "General: remains drowsy but improved perfusion Circulation: cap refill improving (~3 sec), pulses stronger; Capability: Palpation of pulses Breathing: work of breathing reduced if assisted; Lung Sound: Crackles Abdomen: soft; Bowel Sound: Normal Bowel 60 years old"
