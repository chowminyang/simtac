                  - textbox "Investigations" [ref=e943]: "Repeat lactate (if ordered): trending down to 4.2 mmol/L (partial response) Cultures pending Glucose remains elevated; insulin management deferred to ICU plan unless learners address"
                - generic [ref=e944]:
                  - text: Expected actions
                  - textbox "Expected actions" [ref=e945]: "Confirm antibiotics administered and document times; ensure cultures obtained (or document reason if not). Continue vasopressor titration plan and monitoring; confirm appropriate access and infusion pump setup. Finalize ICU transfer checklist: airway status, oxygen delivery, hemodynamics, fluids given, lactate trend, key comorbidities (DM/CKD). Provide structured SBAR handover including anticipated needs (ongoing vasopressors, possible mechanical ventilation, renal monitoring). Team debrief-in-action: summarize current problems and next steps before transfer."
