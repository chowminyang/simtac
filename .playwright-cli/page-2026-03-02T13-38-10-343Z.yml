            - textbox "One entry per line" [ref=e686]: "Recognize sepsis with evolving organ dysfunction and anticipate deterioration to septic shock. Initiate sepsis management: oxygenation/ventilation support, obtain cultures and labs, administer broad-spectrum antibiotics promptly. Perform hemodynamic resuscitation with appropriate crystalloid bolus and reassessment of perfusion. Identify refractory hypotension after fluids and initiate vasopressor therapy with clear escalation and monitoring plan. Demonstrate effective team communication, role allocation, and SBAR consultation/handover. Reassess frequently and respond to trend deterioration (vitals, mental status, urine output, perfusion)."
