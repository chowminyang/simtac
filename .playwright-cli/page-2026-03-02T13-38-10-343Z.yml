                - generic [ref=e835]:
                  - text: Physical exam
                  - textbox "Physical exam" [ref=e836]: "Breathing: increased work; accessory muscle use Lung Sound: Crackles (right base), scattered Lung Sound: Wheezes (optional if learners ask; otherwise keep crackles predominant) Circulation: still warm but cap refill trending slower (~3 sec); Capability: Palpation of pulses Neuro: more lethargic; GCS 13 Airway: patent but tiring; Capability: Difficulty breathing"
                - generic [ref=e837]:
                  - text: Investigations
                  - textbox "Investigations" [ref=e838]: "Repeat lactate (if rechecked or if initial delayed): 3.8 mmol/L CBC: WBC 18 x10^9/L, Hb 125 g/L, Plt 210 x10^9/L CMP: creatinine 2.1 mg/dL (above baseline), mild transaminitis ABG/VBG (if obtained): metabolic acidosis with elevated lactate; PaO2 low on low-flow O2"
                - generic [ref=e839]:
                  - text: Expected actions
                  - textbox "Expected actions" [ref=e840]: "Escalate oxygen delivery (non-rebreather mask) and consider early ventilatory support plan if fatigue/mental status worsens. Continue fluid resuscitation with reassessment (lung exam, perfusion, BP trends). Ensure blood cultures x2 obtained (if not already) and administer antibiotics promptly. Consider urinary catheter for urine output monitoring (if within local scope) and strict I/O. Reassess for septic shock risk: rising lactate, worsening mental status, falling BP. Call for senior/ICU consult early; provide concise update."
                - generic [ref=e841]:
                  - text: Remarks
                  - textbox "Remarks" [ref=e842]: If learners attempt excessive fluids without reassessment, mild worsening crackles may be noted but keep primary problem septic physiology. If antibiotics given here, mark as delayed for debrief comparison.
                - generic [ref=e843]:
                  - text: Instructor control
                  - textbox "Instructor control" [ref=e844]: "If non-rebreather applied, set SpO2 to 92–94%. If 1–2 L total crystalloid given, BP may transiently stabilize at ~112/68 but will trend down in next state. If learners request RT support, have confederate ask: 'Do you want to trial bag-mask or prepare for intubation if he tires?'"
                - generic [ref=e845]:
                  - text: Transition rule
                  - combobox "Transition rule" [ref=e846]:
                    - option "next" [selected]
                    - option "auto"
