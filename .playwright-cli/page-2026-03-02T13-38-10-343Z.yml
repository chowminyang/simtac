              - generic [ref=e799]:
                - generic [ref=e800]:
                  - text: Physical exam
                  - textbox "Physical exam" [ref=e801]: "General: ill-appearing, warm, mildly diaphoretic; oriented to person only Airway: patent; speaking in short sentences Breathing: tachypnea, increased work of breathing; Lung Sound: Crackles (right base) and Lung Sound: Pneumonia (right lower zone suggested) Circulation: warm peripheries, bounding pulses; Capability: Palpation of pulses Neuro: GCS 14 (E4 V4 M6), intermittently confused Skin: warm; Capability: Sweat Abdomen: soft, non-tender; Bowel Sound: Normal Bowel 60 years old"
                - generic [ref=e802]:
                  - text: Investigations
                  - textbox "Investigations" [ref=e803]: "POC glucose: 18 mmol/L (324 mg/dL) 12-lead ECG: sinus tachycardia CXR available on request: right lower lobe infiltrate Labs available on request: CBC, CMP, VBG/ABG, lactate, blood cultures x2, sputum culture (if obtained), urinalysis (optional) Initial lactate (if ordered early): 2.6 mmol/L"
                - generic [ref=e804]:
                  - text: Expected actions
                  - textbox "Expected actions" [ref=e805]: "Assign roles and initiate sepsis pathway/time zero documentation. Primary survey with early recognition of suspected infection + sepsis (tachycardia, tachypnea, altered mental status). Escalate oxygen: start nasal cannula or face mask; target SpO2 ≥ 92% (or per local policy). Capability: Spontaneous breathing. Establish IV access x2; begin isotonic crystalloid (e.g., 500–1000 mL bolus) with reassessment plan. Order sepsis bundle: lactate, CBC/CMP, blood cultures before antibiotics if not delaying, CXR, consider ABG/VBG. Prepare and administer broad-spectrum antibiotics for community-acquired pneumonia per local guideline (after cultures if feasible, without significant delay). Communicate plan to team; consider early ICU/medicine notification given age, confusion, and rising oxygen need."
                - generic [ref=e806]:
                  - text: Remarks
                  - textbox "Remarks" [ref=e807]: "If learners delay oxygen escalation, patient remains hypoxic and more tachypneic. If antibiotics are not ordered within first 10 minutes, prompt via nurse: 'Do you want antibiotics/cultures?' Voice cues (patient): 'I can’t catch my breath… I feel confused.'"
                - generic [ref=e808]:
                  - text: Instructor control
                  - textbox "Instructor control" [ref=e809]: If oxygen applied (e.g., face mask), improve SpO2 to 94% within 1–2 minutes while RR remains elevated. If fluids started, maintain BP initially but HR may decrease slightly (112 → 106). If cultures + antibiotics ordered early, note 'time antibiotics given' for debrief.
                - generic [ref=e810]:
                  - text: Transition rule
                  - combobox "Transition rule" [ref=e811]:
                    - option "next" [selected]
                    - option "auto"
                    - option "handler"
