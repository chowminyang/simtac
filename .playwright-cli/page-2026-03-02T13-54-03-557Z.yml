                - generic [ref=e466]:
                  - text: Expected actions
                  - textbox "Expected actions" [ref=e467]: "Continue titration of vasopressor to maintain MAP ≥65; ensure continuous monitoring Finalize antibiotics (confirm administered time/dose) and document cultures obtained Arrange urgent ICU transfer; communicate anticipated need for intubation and invasive monitoring Provide structured handover (SBAR) to ICU and receiving surgeon/anaesthesia including: diagnosis (septic shock due to anastomotic leak), treatments given (fluids volume, antibiotics, pressor dose), labs (lactate, creatinine), imaging findings, and pending actions (OR) Prepare patient for transport: oxygen, monitoring, infusion pumps, ensure IV lines secured"
                - generic [ref=e468]:
                  - text: Remarks
                  - textbox "Remarks" [ref=e469]: "If learners omit key handover items: ICU outreach asks specifically: ‘How much fluid? When were antibiotics given? What is lactate now? What is the source-control plan?’ If learners request pain control: use cautious titration; avoid causing hypotension. Emphasize reassessment."
                - generic [ref=e470]:
                  - text: Instructor control
                  - textbox "Instructor control" [ref=e471]: Maintain vitals stable if pressors continued; if pressors stopped or not transferred, BP drifts down again. Allow team to ‘pause’ for a handover performance check before transition to final state.
                - generic [ref=e472]:
