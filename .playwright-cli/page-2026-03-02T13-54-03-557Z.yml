                  - text: Physical exam
                  - textbox "Physical exam" [ref=e393]: "Mental status: more drowsy, slow to respond Skin: warm but mottling beginning at knees; cap refill 4 sec Abdomen: increasing distension and tenderness; guarding persists Respiratory: tachypnea; Lung Sound: Crackles (mild bibasal)"
                - generic [ref=e394]:
                  - text: Investigations
                  - textbox "Investigations" [ref=e395]: "Lactate: 4.2 mmol/L CBC: WBC 18.5 x10^9/L, Hb 108 g/L, Platelets 210 x10^9/L CMP: Creatinine 165 µmol/L (baseline 85), Urea elevated; mild metabolic acidosis on VBG (if requested) CRP: 220 mg/L Urinalysis: concentrated; no nitrites/leukocytes If requested: Bedside ultrasound limited—IVC collapsible; no pericardial effusion"
                - generic [ref=e396]:
                  - text: Expected actions
                  - textbox "Expected actions" [ref=e397]: "Declare sepsis with organ dysfunction; communicate plan and assign roles using closed-loop communication Continue fluid resuscitation in boluses with reassessment (target total ~30 mL/kg as appropriate while monitoring for overload) Reassess perfusion endpoints (MAP, mentation, urine output) and trend lactate Request urgent CT abdomen/pelvis with IV contrast (if hemodynamically stable enough) and urgent surgical review for suspected anastomotic leak/source control Prepare for escalation of care: request ICU consult early due to rising lactate, AKI, worsening hypotension Consider bladder scan/foley patency check; ensure urine output is accurately measured"
                - generic [ref=e398]:
                  - text: Remarks
                  - textbox "Remarks" [ref=e399]: "If learners ask for operative details: open sigmoid colectomy; moderate contamination at surgery; anastomosis performed; on POD1 doing ‘okay’. If antibiotics not given by this point, provide cue: ‘No antibiotics have been started yet; blood cultures are pending.’ CT result can be provided in State 3 once ordered."
                - generic [ref=e400]:
                  - text: Instructor control
                  - textbox "Instructor control" [ref=e401]: "If additional 1-2 L crystalloid given: transient BP to ~98/60; HR to ~118; urine output remains low. If learners call ICU/senior surgeon: confederate answers and requests SBAR; agrees to come and suggests pressors if MAP remains low after fluids."
                - generic [ref=e402]:
                  - text: Transition rule
                  - combobox "Transition rule" [ref=e403]:
                    - option "next" [selected]
                    - option "auto"
                    - option "handler"
