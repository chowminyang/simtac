            - button "AI Fill Section" [ref=e85]
          - generic [ref=e86]:
            - textbox "One entry per line" [ref=e87]: Recognize early post-operative sepsis and initiate an evidence-based sepsis bundle (cultures, lactate, antibiotics, fluids) within the first 15 minutes. Perform focused post-op abdominal assessment and identify red flags for anastomotic leak/intra-abdominal source requiring urgent surgical escalation and imaging/source control. Manage septic shock with appropriate crystalloid resuscitation, early vasopressors, and frequent reassessment of perfusion (MAP, urine output, mental status, lactate trend). Demonstrate effective interprofessional teamwork, closed-loop communication, and structured ICU handover including ongoing needs (pressors, lines, antibiotics, OR plan).
