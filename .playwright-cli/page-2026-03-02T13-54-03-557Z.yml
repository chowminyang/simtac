                  - text: Physical exam
                  - textbox "Physical exam" [ref=e428]: "Mental status: obtunded but arousable to voice; GCS 12-13 Circulation: cool peripheries now, weak peripheral pulses; Capability: Palpation of pulses Respiratory: increased work of breathing; Lung Sound: Crackles (worsening bibasal) Abdomen: rigid with rebound/guarding; severe tenderness Urine: essentially anuric over last hour"
                - generic [ref=e429]:
                  - text: Investigations
                  - textbox "Investigations" [ref=e430]: "Repeat lactate (if requested): 5.1 mmol/L CT abdomen/pelvis (when ordered): free fluid and extraluminal air near anastomosis consistent with anastomotic leak; diffuse peritonitis Blood cultures: pending If requested: ABG shows metabolic acidosis; PaO2 mildly low on supplemental O2"
                - generic [ref=e431]:
                  - text: Expected actions
                  - textbox "Expected actions" [ref=e432]: "Recognize septic shock (hypotension requiring vasopressors and lactate elevation) and communicate clearly to team Activate Rapid Response/ICU transfer pathway immediately; request central access support per local process Start vasopressor infusion (e.g., norepinephrine) per institutional protocol while continuing judicious fluids; target MAP ≥65 Escalate to emergency source control: urgent OR booking and/or interventional radiology discussion as appropriate (here: OR for leak/peritonitis) Optimize oxygenation; prepare for potential intubation due to worsening respiratory failure and shock Reassess: perfusion, lungs for fluid overload, glucose control, and analgesia without excessive hypotension"
                - generic [ref=e433]:
                  - text: Remarks
                  - textbox "Remarks" [ref=e434]: "If trainees request capabilities: Capability: IV Access (Right Arm Only). If they request airway management: Capability: Bag-mask ventilation; Capability: Intubation (available if ICU/anaesthesia called). If learners over-resuscitate with fluids without reassessment: crackles and oxygenation worsen; prompt consideration of vasopressors earlier. If norepinephrine started: BP should respond; if delayed, patient continues to deteriorate."
                - generic [ref=e435]:
                  - text: Instructor control
                  - textbox "Instructor control" [ref=e436]: "If vasopressor started and titrated: increase BP to ~92/54 then ~100/60; HR decreases slightly to ~125. If ICU called: ICU outreach requests brief handover and asks for current fluids, antibiotics time, lactate, and suspected source. If OR consulted: surgeon agrees with emergent source control; asks for stabilization and ICU bed."
                - generic [ref=e437]:
                  - text: Transition rule
                  - combobox "Transition rule" [ref=e438]:
                    - option "next" [selected]
                    - option "auto"
                    - option "handler"
