              - generic [ref=e200]:
                - generic [ref=e201]:
                  - text: Physical exam
                  - textbox "Physical exam" [ref=e202]: "General: ill-appearing, anxious, intermittently confused; speaking in short sentences Airway: patent; Capability: Spontaneous breathing Breathing: mild increased work of breathing; Lung Sound: Crackles (bibasal mild, can be described as atelectasis) Circulation: warm peripheries, cap refill ~3 sec; Capability: Palpation of pulses Disability: GCS 14 (E4 V4 M6), oriented to person only Abdomen: distended, diffusely tender with guarding, pain out of proportion; surgical dressing clean/dry Urine: Foley in place with scant dark urine in bag (last hour ~5 mL)"
                - generic [ref=e203]:
                  - text: Investigations
                  - textbox "Investigations" [ref=e204]: "If requested: Point-of-care glucose 14 mmol/L If requested: ECG shows sinus tachycardia If requested: CBC/CMP/CRP pending; blood cultures not yet drawn If requested: Lactate will be provided in State 2 after sampling"
                - generic [ref=e205]:
                  - text: Expected actions
                  - textbox "Expected actions" [ref=e206]: "Perform ABCDE assessment; identify sepsis criteria and organ dysfunction (altered mentation, oliguria, tachypnea) Apply oxygen and titrate to maintain SpO2 ≥94% unless contraindicated Establish/confirm IV access (2 large-bore IVs) and begin isotonic crystalloid resuscitation (e.g., 500-1000 mL bolus) with reassessment Order sepsis labs: lactate, CBC, CMP, coagulation, VBG/ABG as available; obtain blood cultures before antibiotics if feasible without delay Initiate early broad-spectrum antibiotics appropriate for intra-abdominal sepsis per local policy (e.g., piperacillin-tazobactam ± vancomycin depending on risk) Escalate early: call senior surgical registrar/attending and activate Rapid Response/ICU outreach due to suspected sepsis with organ dysfunction"
                - generic [ref=e207]:
                  - text: Remarks
                  - textbox "Remarks" [ref=e208]: "If trainees focus only on pain: nurse prompts ‘she’s more confused and not peeing’ and offers last vitals. If learners ask about output: nurse reports total urine 40 mL over last 6 hours. Avoid delaying antibiotics for imaging; emphasize ‘cultures first if it won’t delay.’ If fluids started promptly, BP may transiently improve but tachycardia persists."
                - generic [ref=e209]:
                  - text: Instructor control
                  - textbox "Instructor control" [ref=e210]: "If oxygen applied to 4-6 L NC: increase SpO2 to 95-96%. If 500-1000 mL crystalloid given: BP increases to ~110/66 briefly, HR decreases to ~112. If no escalation within 5 minutes: confederate nurse suggests calling rapid response due to confusion and low urine."
                - generic [ref=e211]:
                  - text: Transition rule
                  - combobox "Transition rule" [ref=e212]:
                    - option "next" [selected]
                    - option "auto"
                    - option "handler"
