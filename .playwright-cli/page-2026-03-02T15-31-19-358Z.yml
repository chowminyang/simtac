                - generic [ref=e251]:
                  - text: Physical exam
                  - textbox "Physical exam" [ref=e252]: "General: ill-appearing, diaphoretic, anxious; answers slowly but follows commands Airway: patent; speaking in short sentences Breathing: tachypneic; equal air entry; Lung Sound: Crackles (mild bibasilar possible) OR clear if learners reassess later Circulation: warm extremities early, bounding pulses; Capability: Palpation of pulses Neuro: GCS 14 (confused to time), no focal deficits Abdomen: soft; right costovertebral angle tenderness; suprapubic discomfort; Bowel Sound: Normal Bowel 60 years old Skin: warm, flushed"
                - generic [ref=e253]:
                  - text: Investigations
                  - textbox "Investigations" [ref=e254]: "Point-of-care glucose: 14 mmol/L (252 mg/dL) 12-lead ECG: sinus tachycardia Labs available on request (results provided in State 2 if ordered): CBC, CMP/creatinine, lactate, VBG/ABG, blood cultures, urinalysis and urine culture Bedside ultrasound if requested: right hydronephrosis suggested (limited view); no free fluid"
                - generic [ref=e255]:
                  - text: Expected actions
                  - textbox "Expected actions" [ref=e256]: "Assign roles; initiate sepsis pathway; closed-loop communication Primary survey and focused history (flank pain, urinary symptoms, stones, diabetes, meds, allergies) Apply oxygen only if needed; continuous monitoring; obtain temperature Establish 2 large-bore IVs; begin isotonic crystalloid bolus (e.g., 1–2 L initially, reassess) Order labs including lactate, blood cultures, CBC, CMP/creatinine; urinalysis and urine culture Administer broad-spectrum antibiotics early for pyelonephritis/sepsis per local guideline (after cultures if feasible, but do not delay) Consider urinary obstruction: request renal ultrasound/CT planning; early urology/IR notification for potential decompression Reassess hemodynamics and mental status frequently"
                - generic [ref=e257]:
                  - text: Remarks
                  - textbox "Remarks" [ref=e258]: "If asked: EMS report—fever at home, vomited twice, increasingly confused, no chest pain, no shortness of breath. If learners delay antibiotics >10 minutes of scenario time: instructor should prompt via nurse: 'Do you want to start sepsis antibiotics now?' If learners ask about urine output: minimal today; last void small amount, dark, foul-smelling."
                - generic [ref=e259]:
                  - text: Instructor control
                  - textbox "Instructor control" [ref=e260]: "Start monitor with sinus tachycardia; add fever verbally if asked (T 39.4°C). If learners start fluids and antibiotics promptly, hold deterioration until State 2 trigger met (time-based or incomplete resuscitation). Capability: Spontaneous breathing"
                - generic [ref=e261]:
