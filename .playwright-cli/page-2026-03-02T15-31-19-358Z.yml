                  - text: Physical exam
                  - textbox "Physical exam" [ref=e522]: "Neuro: GCS 10–12 (increasingly obtunded; incoherent speech; intermittent agitation) Airway: patent but at risk; secretions may be present if learners ask; Capability: Suctioning Breathing: tachypnea, shallow; Lung Sound: Crackles (may be mild) or clear depending on fluids given Circulation: thready pulses, cool clammy skin; Capability: Palpation of pulses Urine output: minimal to none after catheter insertion (oliguria/anuria) Temperature (if checked): 39.6°C"
                - generic [ref=e523]:
                  - text: Investigations
                  - textbox "Investigations" [ref=e524]: "Repeat lactate (if requested after deterioration): 6.2 mmol/L Glucose recheck: 16 mmol/L (288 mg/dL) If learners ask for bedside echo: hyperdynamic LV, small IVC (if under-resuscitated) OR fuller IVC (if heavy fluids), no pericardial effusion (verbalized finding)"
                - generic [ref=e525]:
                  - text: Expected actions
                  - textbox "Expected actions" [ref=e526]: "Escalate resuscitation: ensure adequate oxygenation/ventilation; consider early airway planning for declining mental status Initiate/upgrade vasopressors and titrate to MAP ≥ 65; consider second-line pressor per local protocol if refractory (verbal acknowledgment acceptable) Confirm antibiotics administered; broaden per local guideline if concerned for resistant organisms Actively pursue source control: communicate 'infected obstructed kidney—urgent decompression'; ensure urology/IR commitment and timing Consider stress-dose steroids only if refractory shock per local protocol (optional objective) Communicate disposition: ICU admission; prepare for transport to IR/OR when stabilized"
                - generic [ref=e527]:
                  - text: Remarks
                  - textbox "Remarks" [ref=e528]: "If learners perform good airway support without intubation: patient can maintain oxygenation but remains at aspiration risk; if vomiting occurs, provide cue: Capability: Vomiting (optional). If learners choose intubation: allow intubation as a controlled escalation; after ventilation/oxygenation and pressors, BP may improve. Capability: Intubation; Capability: Bag-mask ventilation. If learners do not address source control, patient remains unstable despite pressors (no meaningful improvement)."
                - generic [ref=e529]:
                  - text: Instructor control
                  - textbox "Instructor control" [ref=e530]: "If pressors started and titrated: increase BP gradually; if not, maintain severe hypotension and worsening mentation. If learners call urology/IR early and clearly: provide consultant response—'Agree infected obstruction; will perform emergent decompression (stent/nephrostomy) once patient stabilized; ETA 30–60 minutes.'"
                - generic [ref=e531]:
