                  - textbox "Physical exam" [ref=e487]: "Mental status: more confused; GCS 13 (opens eyes to voice, disoriented, follows simple commands) Circulation: now cool peripheries, delayed cap refill; weak pulses; Capability: Palpation of pulses Respiratory: tachypnea; Lung Sound: Crackles (mild) OR clear; no wheeze Abdomen/flank: persistent right CVA tenderness Skin: mottling begins at knees (optional cue)"
                - generic [ref=e488]:
                  - text: Investigations
                  - textbox "Investigations" [ref=e489]: "Lactate: 4.8 mmol/L CBC: WBC 18.5 x10^9/L (neutrophil predominant) CMP: creatinine 2.1 mg/dL (baseline unknown), bicarbonate 18 mmol/L VBG: pH 7.30, pCO2 32 mmHg, HCO3- 16 mmol/L Urinalysis: positive nitrites, leukocyte esterase; many WBC; bacteria present Bedside renal ultrasound (if ordered): moderate right hydronephrosis; possible obstructing stone (not definitively visualized)"
                - generic [ref=e490]:
                  - text: Expected actions
                  - textbox "Expected actions" [ref=e491]: Recognize septic shock (hypotension + lactate elevation) and escalate care Continue fluid resuscitation with reassessment (lung exam, perfusion, BP response) Initiate vasopressor for persistent hypotension (e.g., norepinephrine) and target MAP ≥ 65; titrate to response (verbalized titration acceptable) Consider need for advanced access per local practice (central line) but can start vasopressor peripherally while arranging definitive access Insert urinary catheter and monitor output; reassess renal perfusion Consult urology/IR urgently for decompression of obstructed, infected system (stent vs nephrostomy) and communicate that this is source control Prepare for higher level of care (ICU) and anticipate airway risk with worsening AMS
                - generic [ref=e492]:
                  - text: Remarks
                  - textbox "Remarks" [ref=e493]: "If asked: patient has not taken metformin today; last stone episode 1 year ago, passed spontaneously. If learners give additional large fluid volumes without reassessment: instructor can increase crackles to cue fluid overload risk (Lung Sound: Crackles). If vasopressors started appropriately: BP improves modestly within 2–3 minutes."
                - generic [ref=e494]:
                  - text: Instructor control
                  - textbox "Instructor control" [ref=e495]: "If antibiotics were not given in State 1, emphasize urgency now; keep BP low until antibiotics and vasoactive therapy are started. If learners request CT: provide 'CT KUB/abdomen-pelvis pending' and emphasize not to delay decompression consult. Capability: IV Access (Right Arm Only)"
                - generic [ref=e496]:
                  - text: Transition rule
                  - combobox "Transition rule" [ref=e497]:
