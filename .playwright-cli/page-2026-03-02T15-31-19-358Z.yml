                - generic [ref=e560]:
                  - text: Expected actions
                  - textbox "Expected actions" [ref=e561]: Continue hemodynamic monitoring; titrate vasopressors; reassess volume status and avoid fluid overload Ensure antibiotics documented with time given; ensure cultures obtained if not already Handover to ICU with clear problem list (septic shock from obstructive pyelonephritis, AKI, AMS, lactate trend, interventions, response) Finalize source control logistics (IR/urology) and transport planning; communicate ongoing pressor requirement Discuss glycemic control and medication holds (e.g., hold metformin in AKI) as part of ongoing care (optional)
